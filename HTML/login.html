<!DOCTYPE html>
<html lang="port-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>login</title>

    <link rel="stylesheet" href="../CSS/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-info">

            <div class="brand">
                <div class="logo">🎓</div>

                <div>
                    <h2>EduClass</h2>
                </div>
            </div>

            <div class="welcome">

                <span class="welcome-tag">BEM-VINDO!</span>

                <h1>
                    Educação mais <strong>simples e conectada.</strong>
                </h1>


            </div>

        </div>

        <div class="login-area">

            <div class="login-box">

                <div class="login-header">

                    <h1>Acesse sua conta</h1>

                </div>

                <form id="loginForm">

                    <div class="form-title">

                        <h3 id="tituloLogin">
                            Login do Professor
                        </h3>

                        <p id="descricaoLogin">
                            Entre com seus dados para continuar.
                        </p>

                    </div>


                    <div class="input-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-box">


                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                                required>
<small class="error-message" id="emailError"></small>
                        </div>

                    </div>


                    <div class="input-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-box">

                            <input
                                type="password"
                                id="senha"
                                placeholder="Digite sua senha"
                                minlength="6"
                                maxlength="15"
                                required>

                                <small class="error-message" id="senhaError"></small>

                        </div>
                    
                    </div>


                    <div class="form-options">

                        <label class="remember">

                            <input type="checkbox">

                            <span>
                                Lembrar pra mim
                            </span>

                        </label>

                        <a href="#">
                            Esqueci minha senha
                        </a>

                    </div>

                    <div id="loginError" class="login-error">
                        Preencha todos os campos antes de Entrar.
                    </div>

                   <button type="submit" class="login-button" id="login-button">Entrar</button>

                </form>


                <div class="login-footer">

                    <span>Problemas para acessar?</span>

                    <a href="#">
                        Fale com a secretaria
                    </a>

                </div>

            </div>

        </div>

    </div>

<script src="../JS/script.js"></script>
</body>
</html>
